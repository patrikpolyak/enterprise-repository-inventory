name: All Enterprise Organization Repository Stats

on:
  workflow_dispatch:
    inputs:
      enterprise:
        description: GitHub Enterprise slug
        required: true
        default: patrikpolyak-enterprise-cloud-testing
      max_parallel:
        description: Maximum number of organizations processed concurrently
        required: true
        default: "10"
      base_url:
        description: GitHub API base URL (for GHES, e.g. https://ghes.example.com/api/v3)
        required: false
        default: https://api.github.com
      run_migration_audit:
        description: Run the migration audit alongside stats collection
        type: boolean
        required: false
        default: false
      auth:
        description: Authentication method (github-app uses one enterprise-owned GitHub App installed on the enterprise and on each organization)
        type: choice
        required: true
        default: github-app
        options:
          - github-app
          - pat

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.orgs.outputs.orgs }}
    steps:
      # Token for the app's enterprise installation. Only enterprise permissions
      # apply here: it can list organizations and manage app installations in
      # them, but cannot read organization or repository data.
      - name: Create enterprise installation token
        id: enterprise-token
        if: ${{ inputs.auth == 'github-app' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          enterprise: ${{ inputs.enterprise }}
          github-api-url: ${{ inputs.base_url || 'https://api.github.com' }}

      - name: Fetch all organizations in the enterprise
        id: orgs
        shell: bash
        env:
          AUTH: ${{ inputs.auth }}
          GH_TOKEN: ${{ inputs.auth == 'github-app' && steps.enterprise-token.outputs.token || secrets.ENTERPRISE_PAT }}
          GH_ENTERPRISE_TOKEN: ${{ inputs.auth == 'github-app' && steps.enterprise-token.outputs.token || secrets.ENTERPRISE_PAT }}
          ENTERPRISE: ${{ inputs.enterprise }}
          BASE_URL: ${{ inputs.base_url || 'https://api.github.com' }}
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
        run: |
          set -euo pipefail

          # Derive the gh hostname from the API base URL
          host="${BASE_URL#*://}"
          host="${host%%/*}"
          if [[ "$host" == "api.github.com" ]]; then host="github.com"; fi

          if [[ "$AUTH" == "github-app" ]]; then
            if [[ -z "$APP_CLIENT_ID" ]]; then
              echo "::error::Repository variable APP_CLIENT_ID is not set."
              exit 1
            fi

            orgs="$(
              gh api --hostname "$host" --paginate \
                "/enterprises/$ENTERPRISE/apps/installable_organizations?per_page=100" \
                --jq '.[].login' \
              | sort -u | jq -R . | jq -sc .
            )"

            # Make sure the app is also installed on every organization
            # with access to all repositories
            for org in $(jq -r '.[]' <<<"$orgs"); do
              selection="$(
                gh api --hostname "$host" --paginate \
                  "/enterprises/$ENTERPRISE/apps/organizations/$org/installations?per_page=100" \
                  --jq ".[] | select(.client_id == \"$APP_CLIENT_ID\") | .repository_selection"
              )"
              if [[ -z "$selection" ]]; then
                echo "Installing app on $org"
                gh api --hostname "$host" --method POST --silent \
                  "/enterprises/$ENTERPRISE/apps/organizations/$org/installations" \
                  -f client_id="$APP_CLIENT_ID" \
                  -f repository_selection=all
              elif [[ "$selection" != "all" ]]; then
                echo "::warning::App on $org only has access to selected repositories; stats will be incomplete."
              fi
            done
          else
            orgs="$(
              gh api graphql \
                --hostname "$host" \
                --paginate \
                -F enterprise="$ENTERPRISE" \
                -f query='
                  query($enterprise: String!, $endCursor: String) {
                    enterprise(slug: $enterprise) {
                      organizations(first: 100, after: $endCursor) {
                        nodes { login }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }' \
                --jq '.data.enterprise.organizations.nodes[].login' \
              | sort -u | jq -R . | jq -sc .
            )"
          fi

          count="$(jq 'length' <<<"$orgs")"
          echo "Discovered $count organizations:"
          jq -r '.[]' <<<"$orgs"

          if [[ "$count" -eq 0 ]]; then
            echo "::error::No organizations found for enterprise '${ENTERPRISE}'."
            exit 1
          fi
          # GitHub limits a matrix to 256 jobs per workflow run
          if [[ "$count" -gt 256 ]]; then
            echo "::error::Found $count organizations; a matrix supports at most 256."
            exit 1
          fi

          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"

  stats:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        org: ${{ fromJSON(needs.discover.outputs.orgs) }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Uploads the artifact repo-stats-organization-<org> on success and
      # repo-stats-state-organization-<org> on failure (auto-resumes on re-run)
      - name: Gather repository statistics for ${{ matrix.org }}
        uses: mona-actions/gh-repo-stats-plus@v4.6.0
        with:
          type: organization
          base-url: ${{ inputs.base_url || 'https://api.github.com' }}
          github-token: ${{ github.token }}
          # In github-app mode the action mints a token for the app's
          # installation on this organization
          github-app-id: ${{ inputs.auth == 'github-app' && vars.APP_ID || '' }}
          github-app-private-key: ${{ inputs.auth == 'github-app' && secrets.APP_PRIVATE_KEY || '' }}
          access-token: ${{ inputs.auth == 'pat' && secrets.ENTERPRISE_PAT || '' }}
          organization: ${{ matrix.org }}
          run-migration-audit: ${{ inputs.run_migration_audit && 'true' || 'false' }}

  combine:
    needs: [discover, stats]
    # Combine whatever succeeded, even if some organizations failed
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download organization reports
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: repo-stats-organization-*
          path: output
          merge-multiple: true

      # The combine action merges every CSV in the output directory, so move
      # the per-organization migration audit files out of it first
      - name: Exclude migration audit files from combine
        shell: bash
        run: |
          mkdir -p audit
          find output -maxdepth 1 -name '*-audit.csv' -exec mv {} audit/ \;

      # Writes combined-stats.csv and uploads it as repo-stats-combine-<enterprise>.
      # With only one organization there is nothing to combine; the single CSV
      # is already available in its own repo-stats-organization-<org> artifact.
      - name: Combine organization reports
        uses: mona-actions/gh-repo-stats-plus@v4.6.0
        with:
          type: combine
          base-url: ${{ inputs.base_url || 'https://api.github.com' }}
          github-token: ${{ github.token }}
          organization: ${{ inputs.enterprise }}
